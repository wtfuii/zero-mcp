name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Registry to publish to
        required: true
        type: choice
        default: testpypi
        options:
          - testpypi
          - pypi

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify release metadata
        run: |
          set -euo pipefail
          project_name="$(uv run --no-sync python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["name"])')"
          project_version="$(uv run --no-sync python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          package_version="$(uv run --no-sync python -c 'import zero_mcp; print(zero_mcp.__version__)')"

          if [[ "$project_name" != "finanzen-zero-mcp" ]]; then
            echo "::error::pyproject.toml project.name must be finanzen-zero-mcp, got '$project_name'"
            exit 1
          fi
          if [[ "$project_version" != "$package_version" ]]; then
            echo "::error::pyproject.toml version ($project_version) does not match zero_mcp.__version__ ($package_version)"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$project_version" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match project version $project_version"
              exit 1
            fi
          fi
          echo "Releasing $project_name $project_version"

      - name: Type check
        run: uv run mypy .

      - name: Run tests
        run: uv run pytest

      - name: Build distributions
        run: uv build

      - name: Validate package metadata
        run: uvx twine check --strict dist/*

      - name: Smoke-test the built wheel
        run: |
          set -euo pipefail
          release_version="$(uv run --no-sync python -c 'import zero_mcp; print(zero_mcp.__version__)')"
          export RELEASE_VERSION="$release_version"
          uv run --isolated --no-project --with ./dist/*.whl python - <<'PY'
          import os
          from importlib.metadata import entry_points, version

          import zero_mcp

          expected = os.environ["RELEASE_VERSION"]
          assert version("finanzen-zero-mcp") == expected
          assert zero_mcp.__version__ == expected
          assert any(
              entry.name == "zero-mcp"
              for entry in entry_points(group="console_scripts")
          )
          print(f"wheel imports and exposes zero-mcp at {expected}")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/finanzen-zero-mcp/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/finanzen-zero-mcp/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  github-release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          release_args=()
          if [[ "$tag_version" =~ (a|b|rc|dev)[0-9]+ ]]; then
            release_args+=(--prerelease)
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              "${release_args[@]}"
          fi
