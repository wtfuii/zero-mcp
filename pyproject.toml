[project]
name = "finanzen-zero-mcp"
version = "0.1.0"
description = "MCP server for the German broker Finanzen.net ZERO"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Klaus Deja", email = "klaus.deja@easesolutions.com" }
]
keywords = ["finanzen.net", "zero", "broker", "trading", "mcp", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.13"
dependencies = [
    "finanzen-zero-api>=0.1.0,<0.2.0",
    "mcp>=2.3.0,<3.0.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1,<3.0.0",
]

[project.scripts]
zero-mcp = "zero_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/wtfuii/zero-mcp"
Repository = "https://github.com/wtfuii/zero-mcp"
Issues = "https://github.com/wtfuii/zero-mcp/issues"
Releases = "https://github.com/wtfuii/zero-mcp/releases"

[build-system]
requires = ["uv_build>=0.11.5,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "zero_mcp"

[tool.mypy]
strict = true
exclude = ["captures/", "docs/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]
